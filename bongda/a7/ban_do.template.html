<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bóng đá Việt Nam · Sổ quan hệ A7</title><style>
:root{font-family:system-ui,sans-serif;color:#122927;background:#f4f5ee}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:clamp(16px,4vw,48px)}header{border-bottom:2px solid #183e35;padding-bottom:15px}h1{font-family:Georgia,serif;font-size:clamp(1.8rem,4vw,3rem);margin:5px 0}p{line-height:1.5;margin:8px 0}.eyebrow{font-size:.78rem;font-weight:750;letter-spacing:.1em;color:#326a57}section{background:#fff;border:1px solid #d3ddcf;margin:16px 0;padding:18px;border-radius:8px}label{display:grid;gap:5px;font-size:.86rem;font-weight:650}.tools{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select,button{font:inherit;max-width:100%;padding:9px;color:inherit;border:1px solid #98aaa2;border-radius:4px;background:white}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ca762a;outline-offset:2px}#graph{width:100%;height:auto;display:block}#excerpt{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f5ee;padding:12px;font-size:.9rem;max-height:260px;overflow:auto}.small{color:#476055;font-size:.88rem}#examples{display:flex;gap:6px;flex-wrap:wrap}a{color:#05654e}svg text{font-family:system-ui,sans-serif}h2{font:700 1.3rem Georgia,serif;margin:0 0 12px}.actions{display:flex;gap:12px;flex-wrap:wrap}#list{width:100%}@media(max-width:600px){.tools{grid-template-columns:1fr}body{padding:14px}section{padding:12px}}@media print{.tools,#examples,.actions{display:none}body{background:#fff}section{break-inside:avoid}}#neighbors{display:block;max-width:780px;width:100%;height:auto}#branchChoices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,275px),1fr));gap:6px}#branchChoices button{text-align:left;font-size:.83rem}@media(max-width:600px){#neighbors{display:none}}.tools>*{min-width:0}select{min-width:0;width:100%}</style>
<header><div class="eyebrow">ĐỀ TÀI 22 · A7</div><h1>Sổ quan hệ bóng đá Việt Nam</h1><p>Mỗi mũi tên là một sự kiện có nguồn. Chọn một người hoặc CLB để đọc theo chiều mũi tên: ai → làm gì → với ai.</p><p class="small" id="summary"></p></header>
<section><h2>1. Chọn điểm bắt đầu</h2><div id="examples"></div><br><div class="tools"><label>Tìm theo tên (có thể gõ không dấu)<input id="search" placeholder="Ví dụ: Quang Hải" autocomplete="off"></label><label>Nút phù hợp<select id="entity"></select></label><label>Quan hệ<select id="rel"></select></label><label>Sự kiện · có thể có nhiều mùa/trận<select id="list"></select></label></div></section>
<section><h2 id="neighTitle">Các mối liên hệ</h2><p class="small" id="neighNote"></p><svg id="neighbors" xmlns="http://www.w3.org/2000/svg"></svg><div id="branchChoices"></div></section>
<section><h2>2. Đọc quan hệ</h2><svg id="graph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" aria-label="Cặp thực thể và quan hệ có hướng" role="img"></svg><p id="reading" aria-live="polite"></p><div class="actions"><button id="jump">Khám phá nút còn lại</button><button id="save">Lưu hình SVG</button></div></section><section><h2>3. Kiểm tra bằng chứng</h2><p id="info"></p><p><a id="source" target="_blank" rel="noopener">Mở nguồn gốc ↗</a></p><details open><summary>Đoạn trích trong dữ liệu</summary><div id="excerpt"></div></details><p class="small" id="fact"></p></section>
<script id="dataset" type="application/json">DATA_HERE</script>
<script>
const {nodes,edges,sources,quotes,labels}=JSON.parse(document.getElementById('dataset').textContent),el=id=>document.getElementById(id),nm=i=>nodes[i][1],norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d'),index=new Map(nodes.map((n,i)=>[n[0],i])),adj=nodes.map(()=>[]);edges.forEach((e,i)=>{adj[e[0]].push(i);adj[e[1]].push(i)});let active,indexed,filtered;const svg=el('graph'),ns=svg.namespaceURI;
function opt(v,s){return new Option(s,String(v))}
function pick(i){el('search').value='';updateNames(i)}
function updateNames(preferred){const q=norm(el('search').value.trim());const hits=nodes.map((_,i)=>i).filter(i=>norm(nm(i)).includes(q)).sort((a,b)=>nm(a).localeCompare(nm(b),'vi'));el('entity').replaceChildren(...hits.map(i=>opt(i,nm(i)+' · '+nodes[i][2])));if(hits.includes(preferred))el('entity').value=String(preferred);loadNode()}
function loadNode(){active=el('entity').value===''?-1:+el('entity').value;indexed=active===-1?[]:adj[active];const rels=[...new Set(indexed.map(i=>edges[i][2]))];el('rel').replaceChildren(opt('', 'Tất cả ('+indexed.length+')'),...rels.sort().map(r=>opt(r,labels[r])));filter()}
function neighbors(){
 const panel=el('neighbors'), buttonArea=el('branchChoices');panel.replaceChildren();buttonArea.replaceChildren();
 if(!filtered.length){el('neighNote').textContent='';el('neighTitle').textContent='Không có mối liên hệ để hiển thị.';return}
 const activeName=nm(active);el('neighTitle').textContent='Các mối liên hệ của '+activeName;
 const pool=new Map();for(const j of filtered){const [u,v,r]=edges[j],opp=u===active?v:u,key=[opp,r,u===active].join('|');if(!pool.has(key))pool.set(key,{opp,r,n:0,j,forward:u===active});pool.get(key).n++}
 const ranked=[...pool.values()].sort((a,b)=>b.n-a.n||nm(a.opp).localeCompare(nm(b.opp),'vi'));
 const chosen=[],seen=new Set();for(const item of ranked)if(!seen.has(item.r)&&chosen.length<6){chosen.push(item);seen.add(item.r)}
 for(const item of ranked)if(chosen.length<6&&!chosen.includes(item))chosen.push(item);
 el('neighNote').textContent='Hiện '+chosen.length+' trong '+pool.size+' nhóm quan hệ. Mỗi nhánh ưu tiên một loại khác nhau; số trong ngoặc là số sự kiện của nhóm.';
 const ns='http://www.w3.org/2000/svg',mk=(t,a,txt)=>{const x=document.createElementNS(ns,t);for(const [k,v] of Object.entries(a))x.setAttribute(k,v);if(txt)x.textContent=txt;panel.append(x);return x};
 const width=640,row=46,h=chosen.length*row+18;panel.setAttribute('viewBox','0 0 '+width+' '+h);panel.setAttribute('role','img');panel.setAttribute('aria-label','Những quan hệ xung quanh '+activeName);mk('title',{},'Quan hệ xung quanh '+activeName);
 const centerY=h/2;const pts=chosen.map((c,i)=>{let y=17+i*row;mk('line',{x1:196,y1:centerY,x2:350,y2:y,stroke:'#759285','stroke-width':1.5});return y});
 const centerLines=words(activeName,21);mk('rect',{x:5,y:centerY-centerLines.length*8-10,width:191,height:centerLines.length*16+20,rx:8,fill:'#d4e9db',stroke:'#708f7c'});centerLines.forEach((s,i)=>mk('text',{x:100,y:centerY-(centerLines.length-1)*8+4+i*16,'text-anchor':'middle','font-size':15,fill:'#18352d'},s));
 chosen.forEach((c,i)=>{let y=pts[i],label=nm(c.opp),caption=(c.forward?'→ ':'← ')+labels[c.r]+' ('+c.n+')';
 mk('circle',{cx:350,cy:y,r:3,fill:'#356351'});mk('text',{x:362,y:y+1,'font-size':14,fill:'#19392d'},label.length>40?label.slice(0,37)+'…':label);mk('text',{x:362,y:y+17,'font-size':12,fill:'#365c50'},caption);
 const b=document.createElement('button');b.type='button';b.textContent=(i+1)+'. '+(c.forward?activeName:nm(c.opp))+' → '+labels[c.r]+' → '+(c.forward?nm(c.opp):activeName)+' ('+c.n+')';b.onclick=()=>{el('list').value=String(c.j);draw()};buttonArea.append(b)});
}

function filter(prefer){const r=el('rel').value;filtered=indexed.filter(i=>!r||edges[i][2]===r).sort((a,b)=>edges[b][3].localeCompare(edges[a][3],'vi'));el('list').replaceChildren(...filtered.map(i=>{const e=edges[i];return opt(i,e[3]+' · '+labels[e[2]]+' · '+nm(e[0]===active?e[1]:e[0]))}));if(filtered.includes(prefer))el('list').value=String(prefer);neighbors();draw()}
function tag(t,attrs,content){const x=document.createElementNS(ns,t);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);if(content)x.textContent=content;svg.append(x);return x}
function words(s,limit){let lines=[''];for(const w of s.split(' ')){let i=lines.length-1;if(lines[i]&&(lines[i]+' '+w).length>limit)lines.push(w);else lines[i]+=(lines[i]?' ':'')+w}return lines}
function draw(){svg.replaceChildren();const empty=!el('list').value;el('jump').disabled=el('save').disabled=empty;el('source').hidden=empty;if(empty){for(const k of ['info','fact','excerpt'])el(k).textContent='';el('reading').textContent='Không có sự kiện khớp.';return}
const [s,d,r,period,si,qi,fid]=edges[+el('list').value],narrow=window.innerWidth<620, W=narrow?320:640, H=narrow?240:160;svg.setAttribute('viewBox','0 0 '+W+' '+H);const mid=narrow?160:320;const points=narrow?[[160,42],[160,196]]:[[105,84],[535,84]];
tag('title',{},nm(s)+' → '+labels[r]+' → '+nm(d));tag('line',narrow?{x1:160,y1:70,x2:160,y2:157,stroke:'#356351','stroke-width':2}:{x1:204,y1:84,x2:432,y2:84,stroke:'#356351','stroke-width':2});
tag('polygon',{points:narrow?'154,154 166,154 160,166':'429,78 441,84 429,90',fill:'#356351'});
for(const [j,id] of [s,d].entries()){const [x,y]=points[j],wide=narrow?250:202,lines=words(nm(id),narrow?26:21);let height=Math.max(62,lines.length*15+28);tag('rect',{x:x-wide/2,y:y-height/2,width:wide,height,rx:12,fill:id===active?'#d4e9db':'#e8e9da',stroke:'#708f7c'});const start=y-(lines.length-1)*7.5;lines.forEach((l,j)=>tag('text',{x,y:start+j*15-2,'text-anchor':'middle','font-size':13,fill:'#18352d','font-weight':650},l));tag('text',{x,y:start+lines.length*15,'text-anchor':'middle','font-size':11,fill:'#416051'},nodes[id][2])}
const lab=labels[r];tag('rect',{x:mid-99,y:narrow?99:46,width:198,height:23,fill:'#fff'});tag('text',{x:mid,y:narrow?116:63,'text-anchor':'middle','font-size':14,fill:'#18352d','font-weight':700},lab);
el('reading').textContent=nm(s)+' → '+lab+' → '+nm(d)+' · '+period+'.';el('info').textContent=sources[si][0]+' · '+sources[si][1];el('source').href=sources[si][2];el('excerpt').textContent=quotes[qi];el('fact').textContent='Mã cạnh: '+fid+' · Quan hệ: '+r}
el('search').oninput=()=>updateNames(active);el('entity').onchange=loadNode;el('rel').onchange=()=>filter();el('list').onchange=draw;el('jump').onclick=()=>{const e=edges[+el('list').value];pick(e[0]===active?e[1]:e[0])};el('save').onclick=()=>{const data=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download='quan-he-'+edges[+el('list').value][6]+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};window.addEventListener('resize',draw);
for(const [id,fid] of [["p-066ef3e195d64dfc3cc5", "f_1f3f6f35cf9bc776a08b"], ["p-9fbd48b7e76effd9f48b", "f_9801c83662cbd0b4c40c"], ["p-29b9a3a3c585694504d8", "f_9571a08e374a0e81234b"], ["firm-a7-0d8e5637d77e02df7e93", "f_5a50f96aa7930b85e614"], ["p-vq", "f_3126e483d4f01abade9c"], ["o-vff", "f_776a8c1915cfd508f424"]]){const i=index.get(id);if(i==null)continue;let b=document.createElement('button');b.textContent=nm(i);b.onclick=()=>{pick(i);if(fid)filter(edges.findIndex(e=>e[6]===fid))};el('examples').append(b)}
el('summary').textContent=nodes.length.toLocaleString('vi')+' nút · '+edges.length.toLocaleString('vi')+' cạnh sự kiện · '+Object.keys(labels).length+' loại quan hệ';pick(index.get('p-066ef3e195d64dfc3cc5'));filter(edges.findIndex(e=>e[6]==='f_1f3f6f35cf9bc776a08b'));
</script></html>
