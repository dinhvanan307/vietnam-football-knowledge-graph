<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mạng bóng đá Việt Nam · A10</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#172c31;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}small{color:#465d62}h1{font-size:clamp(26px,4vw,45px);margin:8px 0}header{border-bottom:2px solid #164e47;padding-bottom:14px}nav,.filters,.diagram{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}button,select,input{font:inherit;padding:9px 12px;border:1px solid #b0bcb7;background:white;border-radius:7px}button{cursor:pointer}button[aria-pressed=true]{background:#15574f;color:white}input{min-width:220px;max-width:100%}section{display:grid;grid-template-columns:minmax(220px,34%) 1fr;gap:17px}aside,article{border:1px solid #ccd5cf;border-radius:12px;background:white;padding:16px;min-width:0}aside{max-height:60vh;overflow:auto}aside button{display:block;text-align:left;width:100%;margin-bottom:5px;font-size:14px}.node{background:#dcefe7;color:#10473f;padding:16px 12px;border-radius:10px;font-weight:650}.arrow{color:#33625b;text-align:center}.arrow b{display:block;font-size:29px}blockquote{margin:10px 0;padding:12px;border-left:4px solid #64978b;background:#f5f8f6;overflow-wrap:anywhere;white-space:pre-wrap}a{color:#075e6d}article p{overflow-wrap:anywhere}@media(max-width:680px){main{padding:15px}section{display:flex;flex-direction:column-reverse}aside{max-height:35vh}}
</style><main><header><small>ĐỀ TÀI 22 · BÓNG ĐÁ VIỆT NAM · A10</small><h1>Ai liên hệ với ai?</h1><p>Chọn một quan hệ để xem thời điểm và bằng chứng báo chí.</p></header><nav id="tabs"></nav><div id="hint"></div><div class="filters"><input id="search" aria-label="Tìm tên" placeholder="Tìm cầu thủ, CLB, quan hệ…"><select id="family" aria-label="Nhóm quan hệ"></select><select id="format" aria-label="Dạng nguồn"></select></div><p id="counts"></p><section><aside id="items"></aside><article id="detail"></article></section></main><script>
const D=PAYLOAD_HERE,$=id=>document.getElementById(id),titles=['Quan hệ xã hội','Bối cảnh bóng đá','Đồng đội suy ra'],hints=['Cầu thủ, HLV, lãnh đạo, CLB, đội tuyển và tổ chức. Hai đầu của mỗi cạnh đều là tác nhân.','Giải, trận và sân giải thích hoàn cảnh của các sự kiện. Một trận chỉ tính là một nút bối cảnh.','Mỗi cặp có hai cầu thủ đá chính cùng CLB trong ít nhất một trận; số trận là trọng số. Các cặp không cộng vào số cạnh trực tiếp.'],labels={bai_viet:'Bài viết',bang_bao:'Bảng trên báo',ca_hai:'Cả hai dạng nguồn',suy_ra:'Suy từ đội hình'},norm=x=>x.toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');let lane=0,limit=45;
function el(tag,txt,parent,cls){const n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;parent.append(n);return n}
function options(id,vals){const t=$(id);t.replaceChildren();for(const [k,v] of vals){const o=el('option',v,t);o.value=k}}
function switchTo(i,first=false){lane=i;limit=45;$('search').value='';$('hint').textContent=hints[i];[...$('tabs').children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j));options('family',[['','Mọi nhóm'],...Array.from(new Set(D[i].map(x=>x[4]))).sort().map(k=>[k,k])]);options('format',[['','Mọi dạng nguồn'],...Array.from(new Set(D[i].map(x=>x[5]))).map(k=>[k,labels[k]])]);show(first)}
function proof(parent,r){el('p',labels[r[5]]+' · '+r[3]+' · '+r[8],parent);el('blockquote',r[7],parent);const a=el('a','Mở nguồn báo chí ↗',parent);a.href=r[6];a.target='_blank';a.rel='noopener noreferrer'}
function pick(r){const t=$('detail');t.replaceChildren();el('small',titles[lane].toUpperCase()+' / '+r[4].toUpperCase(),t);const g=el('div','',t,'diagram');el('span',r[0],g,'node');el('b',r[2]+' '+(lane===2?'↔':'→'),g,'arrow');el('span',r[1],g,'node');if(lane!==2){proof(t,r);return}el('p',r[3]+' có bằng chứng. Mở từng trận để đối chiếu hai vị trí đá chính:',t);for(const q of r[6]){const det=el('details','',t);el('summary',q[0]+' · '+q[1],det);for(const index of q.slice(2))proof(det,D[1][index])}}
function show(first=false){const q=norm($('search').value),v=$('family').value,f=$('format').value;const arr=D[lane].filter(r=>(!v||r[4]===v)&&(!f||r[5]===f)&&(!q||norm(r.slice(0,5).join(' ')).includes(q)));if(first===true){const i=arr.findIndex(r=>r[8]==='f_3126e483d4f01abade9c');if(i>0)arr.unshift(arr.splice(i,1)[0])}const t=$('items');t.replaceChildren();$('counts').textContent=arr.length.toLocaleString('vi')+' kết quả · hiện '+Math.min(arr.length,limit);for(const r of arr.slice(0,limit)){const b=el('button',r[0]+' · '+r[2]+' · '+r[1],t);b.onclick=()=>pick(r)}if(arr.length>limit)el('button','Xem thêm',t).onclick=()=>{limit+=45;show()};if(arr.length)pick(arr[0]);else $('detail').textContent='Không có quan hệ khớp bộ lọc.'}
titles.forEach((s,i)=>el('button',s,$('tabs')).onclick=()=>switchTo(i));for(const id of ['search','family','format'])$(id).oninput=()=>{limit=45;show()};switchTo(0,true);
</script></html>
