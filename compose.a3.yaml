name: vietnam_football_a3
services:
  db:
    image: neo4j:2026.10.1-community
    ports:
      - "127.0.0.1:7476:7474"
      - "127.0.0.1:7689:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_directories_import: /import
      NEO4J_server_bolt_advertised__address: 127.0.0.1:7689
      NEO4J_server_http_advertised__address: 127.0.0.1:7476
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - a3_data:/data
      - ./work/a3_import:/import/real:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  a3_data:
