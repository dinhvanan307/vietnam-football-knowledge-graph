name: d22_press_a7
services:
  db:
    image: neo4j:2026.10.1-community
    ports:
      - "127.0.0.1:7483:7474"
      - "127.0.0.1:7696:7687"
    environment:
      NEO4J_server_directories_import: /import
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set local password}"
      NEO4J_server_bolt_advertised__address: "127.0.0.1:7696"
      NEO4J_server_http_advertised__address: "127.0.0.1:7483"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 1280m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - data:/data
      - ${A7_DATA_ROOT:-./work/a7}/A7_Ban_nop/import:/import/real:ro
volumes:
  data:
    name: d22_press_a7_release_data
