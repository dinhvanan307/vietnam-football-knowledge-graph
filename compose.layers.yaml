name: d22_a10_layers
services:
  db:
    image: neo4j:2026.10.1-community
    ports:
      - "127.0.0.1:7488:7474"
      - "127.0.0.1:7701:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set the local password}"
      NEO4J_server_bolt_advertised__address: "127.0.0.1:7701"
      NEO4J_server_http_advertised__address: "127.0.0.1:7488"
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 64m
    volumes:
      - data:/data
volumes:
  data:
    name: d22_a10_layers_data
