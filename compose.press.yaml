name: d22_a8_news
services:
  db:
    image: neo4j:2026.10.1-community
    ports:
      - "127.0.0.1:7484:7474"
      - "127.0.0.1:7697:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set the local password}"
      NEO4J_server_bolt_advertised__address: "127.0.0.1:7697"
      NEO4J_server_http_advertised__address: "127.0.0.1:7484"
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 64m
    volumes:
      - data:/data
volumes:
  data:
    name: d22_a8_news_data
